[env]
# Single source of truth for the dev container / image / in-container
# workspace name. Change this and it propagates to flake.nix and scripts/*.sh
# (which read it from the environment mise exports).
PROJECT_NAME = "corporate-nayose"

[tasks.build]
description = "Build dev container image with nix"
file = "scripts/build.sh"

[tasks.up]
description = "Start dev container"
file = "scripts/up.sh"

[tasks.down]
description = "Stop and remove dev container"
run = "docker stop $PROJECT_NAME && docker rm $PROJECT_NAME"

[tasks.attach]
description = "Attach to dev container"
run = "docker exec -it -w /workspaces/$PROJECT_NAME $PROJECT_NAME /bin/zsh"

[tasks.setup]
description = "Setup environment inside running container (Rust, Claude CLI, etc.)"
run = "docker exec -u 1000 $PROJECT_NAME bash /workspaces/$PROJECT_NAME/scripts/setup.sh"

[tasks.fmt]
description = "Check formatting with cargo fmt"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint with cargo clippy"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.tables]
description = "Build parquet tables from the raw registry CSVs in data/"
run = "cargo run --release -- build-tables"

[tasks.verify-tables]
description = "Verify built parquet tables against the raw data"
run = "cargo test --release --test verify_real_data -- --ignored --nocapture"

[tasks.test]
description = "Run unit tests"
run = "RUSTFLAGS=\"-D warnings\" cargo test --workspace --lib --bins"

[tasks.test-e2e]
description = "Run e2e tests"
run = "cargo test --tests"

[tasks.pre-commit]
description = "Run fmt, clippy, and unit tests"
depends = ["fmt", "clippy", "test"]

[tasks.coverage]
description = "Generate test coverage report"
run = """
eval "$(cargo llvm-cov show-env --sh)"
cargo llvm-cov clean --workspace
cargo test
cargo llvm-cov report --summary-only
"""
